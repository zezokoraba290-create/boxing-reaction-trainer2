name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo-dev cmake libffi-dev libssl-dev \
            libltdl-dev libsqlite3-dev

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version
          python -m pip install "pip<24.0"
          python -m pip install buildozer
          python -m pip install cython==0.29.37

      - name: Cache Buildozer global files
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-ubuntu22-api35-ndk28c
          restore-keys: |
            buildozer-global-ubuntu22-

      - name: Cache Buildozer project
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-ubuntu22-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-ubuntu22-

      - name: Check Java installation
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          which java

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          source venv/bin/activate
          echo "Python: $(python --version)"
          echo "Buildozer: $(buildozer --version)"
          echo "Java: $(java -version 2>&1 | head -n 1)"
          echo "Starting Android build..."
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-reaction-trainer-apk
          path: "bin/*.apk"
          if-no-files-found: error

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_build.log
          if-no-files-found: ignore

